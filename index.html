<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noetic Creative — Repos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --paper:   #FAFAF7;
  --ink:     #0A0A0E;
  --ink-soft:#1A1A1F;
  --ink-mute:#6B6B7B;
  --ink-faint:#A8A8B5;
  --card:    #FFFFFF;
  --purple:  #6C5CE7;
  --purple-deep:#4D3FC9;
  --purple-bg: rgba(108,92,231,.07);
  --purple-bg2:rgba(108,92,231,.13);
  --rule:    rgba(10,10,14,.08);
  --rule-med:rgba(10,10,14,.14);
  --font-display:'Fraunces',serif;
  --font-sans:'Manrope',-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:12px;
  --sidebar:260px;
}

html{height:100%}
body{min-height:100%;background:var(--paper);color:var(--ink-soft);font-family:var(--font-sans);font-size:15px;line-height:1.55;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
::selection{background:var(--purple);color:#fff}
a{color:var(--purple);text-decoration:none}
a:hover{color:var(--purple-deep)}
button{cursor:pointer;font-family:var(--font-sans)}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(250,250,247,.9);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:16px;
  padding:0 28px;height:60px;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;letter-spacing:-.02em}
.logo-mark{width:30px;height:30px;background:var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{width:16px;height:16px}
.header-gap{flex:1}

.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none;width:14px;height:14px}
.search-wrap input{
  background:var(--card);border:1px solid var(--rule-med);border-radius:8px;
  color:var(--ink);font-family:var(--font-sans);font-size:13px;
  padding:7px 12px 7px 32px;width:220px;outline:none;
  transition:border-color .15s,width .2s,box-shadow .15s;
}
.search-wrap input:focus{border-color:var(--purple);width:280px;box-shadow:0 0 0 3px var(--purple-bg)}
.search-wrap input::placeholder{color:var(--ink-faint)}

.btn-header{
  display:flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--rule-med);border-radius:8px;
  color:var(--ink-mute);font-size:12px;font-weight:500;padding:6px 12px;
  transition:all .15s;white-space:nowrap;
}
.btn-header:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-bg)}
.btn-header.active{border-color:var(--purple);color:var(--purple);background:var(--purple-bg)}
.btn-header svg{width:13px;height:13px}

/* ── LAYOUT ── */
.layout{display:flex;min-height:calc(100vh - 60px)}

/* ── SIDEBAR ── */
aside{
  width:var(--sidebar);flex-shrink:0;
  border-right:1px solid var(--rule);
  padding:24px 0 40px;position:sticky;top:60px;
  height:calc(100vh - 60px);overflow-y:auto;
  background:var(--paper);
}
.sidebar-section{padding:0 16px;margin-bottom:8px}
.sidebar-label{
  font-family:var(--font-mono);font-size:10px;font-weight:500;
  letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;
  padding:12px 8px 6px;
}
.folder-btn{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:none;color:var(--ink-mute);font-size:13px;font-weight:500;
  padding:8px 10px;border-radius:8px;transition:all .12s;position:relative;
}
.folder-btn:hover{background:var(--card);color:var(--ink)}
.folder-btn.active{background:var(--purple-bg);color:var(--purple)}
.folder-btn .icon{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.folder-btn .label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder-btn .count{
  font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);
  background:var(--rule);padding:1px 6px;border-radius:999px;flex-shrink:0;
}
.folder-btn.active .count{background:var(--purple-bg2);color:var(--purple)}

.folder-item{position:relative;display:flex;align-items:center}
.folder-item .edit-btn{
  position:absolute;right:8px;
  opacity:0;background:none;border:none;color:var(--ink-mute);
  padding:3px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  transition:opacity .12s;
}
.folder-item:hover .edit-btn{opacity:1}
.folder-item .edit-btn:hover{background:var(--rule);color:var(--purple)}
.folder-item .edit-btn svg{width:12px;height:12px}

.btn-new-folder{
  display:flex;align-items:center;gap:7px;width:100%;
  background:none;border:1px dashed var(--rule-med);border-radius:8px;
  color:var(--ink-faint);font-size:12px;font-weight:500;
  padding:7px 10px;margin-top:4px;transition:all .15s;
}
.btn-new-folder:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-bg)}
.btn-new-folder svg{width:12px;height:12px}

/* ── MAIN ── */
main{flex:1;padding:32px 36px;max-width:none}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:28px;flex-wrap:wrap}
.view-title{
  font-family:var(--font-display);font-size:22px;font-weight:600;
  color:var(--ink);letter-spacing:-.02em;flex:1;min-width:160px;
}
.view-title .sub{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);font-weight:400;margin-left:10px;letter-spacing:.05em}

.sort-group{display:flex;gap:3px}
.sort-btn{
  background:var(--card);border:1px solid var(--rule-med);border-radius:7px;
  color:var(--ink-mute);font-size:12px;font-weight:500;padding:5px 11px;
  transition:all .12s;
}
.sort-btn:hover{border-color:var(--rule-med);color:var(--ink)}
.sort-btn.active{border-color:var(--purple);color:var(--purple);background:var(--purple-bg)}

.view-toggle{display:flex;gap:0}
.view-btn{
  background:var(--card);border:1px solid var(--rule-med);
  color:var(--ink-faint);padding:5px 9px;font-size:13px;
  transition:all .12s;
}
.view-btn:first-child{border-radius:7px 0 0 7px}
.view-btn:last-child{border-radius:0 7px 7px 0;border-left:none}
.view-btn.active{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}

/* ── REPO CARDS ── */
.repo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.repo-grid.list{grid-template-columns:1fr;gap:8px}

.repo-card{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  padding:20px;display:flex;flex-direction:column;gap:12px;
  transition:border-color .15s,box-shadow .15s,transform .12s;
  text-decoration:none;color:inherit;
}
.repo-card:hover{border-color:var(--purple);box-shadow:0 2px 16px rgba(108,92,231,.1);transform:translateY(-1px)}

.repo-grid.list .repo-card{flex-direction:row;align-items:center;gap:16px;padding:14px 20px}

.repo-header{display:flex;align-items:flex-start;gap:10px}
.repo-icon{
  width:34px;height:34px;background:var(--paper);border:1px solid var(--rule);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--ink-mute);
}
.repo-name{font-weight:700;font-size:14px;color:var(--ink);letter-spacing:-.02em;line-height:1.3}
.repo-private{
  display:inline-flex;align-items:center;gap:3px;
  font-family:var(--font-mono);font-size:9px;color:var(--ink-mute);
  background:var(--rule);border-radius:999px;padding:1px 6px;
  margin-left:5px;vertical-align:middle;
}
.repo-folder-tag{
  display:inline-block;
  font-family:var(--font-mono);font-size:9px;color:var(--purple);
  background:var(--purple-bg);border:1px solid var(--purple-bg2);
  border-radius:999px;padding:1px 7px;margin-top:3px;
}
.repo-desc{font-size:13px;color:var(--ink-mute);line-height:1.5;flex:1}
.repo-grid.list .repo-desc{flex:1;margin:0}
.repo-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:auto}
.repo-grid.list .repo-meta{margin:0;margin-left:auto;flex-shrink:0}
.repo-lang{display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11px;color:var(--ink-mute)}
.lang-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.repo-stat{font-family:var(--font-mono);font-size:11px;color:var(--ink-mute)}
.repo-updated{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}

.lang-TypeScript{background:#3178c6}.lang-JavaScript{background:#f7df1e}
.lang-HTML{background:#e34c26}.lang-CSS{background:#563d7c}
.lang-Python{background:#3572A5}.lang-default{background:#ccc}

/* ── FOLDER EDIT PANEL ── */
.panel-overlay{position:fixed;inset:0;background:rgba(10,10,14,.35);z-index:200;display:flex;align-items:flex-start;justify-content:flex-end;backdrop-filter:blur(2px)}
.panel-overlay.hidden{display:none}
.panel{
  width:420px;max-width:90vw;height:100vh;background:var(--card);
  border-left:1px solid var(--rule);display:flex;flex-direction:column;
  overflow:hidden;
}
.panel-header{
  display:flex;align-items:center;gap:12px;
  padding:20px 24px;border-bottom:1px solid var(--rule);flex-shrink:0;
}
.panel-header h3{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink);flex:1;letter-spacing:-.02em}
.panel-close{background:none;border:none;color:var(--ink-mute);padding:4px;border-radius:6px;display:flex}
.panel-close:hover{background:var(--rule);color:var(--ink)}
.panel-close svg{width:16px;height:16px}
.panel-body{flex:1;overflow-y:auto;padding:24px}
.panel-footer{padding:16px 24px;border-top:1px solid var(--rule);display:flex;gap:8px;flex-shrink:0}

.field{margin-bottom:20px}
.field label{display:block;font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:6px}
.field input,.field select{
  width:100%;background:var(--paper);border:1px solid var(--rule-med);border-radius:8px;
  color:var(--ink);font-family:var(--font-sans);font-size:14px;padding:9px 12px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.field input:focus,.field select:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-bg)}
.icon-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.icon-opt{
  width:36px;height:36px;border:1px solid var(--rule-med);border-radius:8px;
  background:var(--paper);font-size:16px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .12s;
}
.icon-opt:hover{border-color:var(--purple);background:var(--purple-bg)}
.icon-opt.selected{border-color:var(--purple);background:var(--purple-bg)}

.repos-picker-label{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:8px;display:block}
.repos-search{width:100%;background:var(--paper);border:1px solid var(--rule-med);border-radius:8px;color:var(--ink);font-family:var(--font-sans);font-size:13px;padding:7px 12px;outline:none;margin-bottom:10px;transition:border-color .15s}
.repos-search:focus{border-color:var(--purple)}
.repos-list{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto;padding-right:4px}
.repo-pick-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border:1px solid var(--rule);border-radius:8px;cursor:pointer;
  transition:all .12s;
}
.repo-pick-item:hover{border-color:var(--rule-med);background:var(--paper)}
.repo-pick-item.selected{border-color:var(--purple);background:var(--purple-bg)}
.repo-pick-item input[type=checkbox]{accent-color:var(--purple);width:14px;height:14px;flex-shrink:0}
.repo-pick-name{font-size:13px;font-weight:600;color:var(--ink);flex:1}
.repo-pick-lang{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}

.danger-zone{margin-top:24px;padding-top:20px;border-top:1px solid var(--rule)}
.danger-zone .danger-label{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#dc2626;margin-bottom:8px;display:block}

/* ── BUTTONS ── */
.btn-primary{
  background:var(--purple);color:#fff;border:none;border-radius:8px;
  padding:9px 20px;font-size:13px;font-weight:600;font-family:var(--font-sans);
  transition:background .15s;
}
.btn-primary:hover{background:var(--purple-deep)}
.btn-secondary{
  background:transparent;border:1px solid var(--rule-med);border-radius:8px;
  color:var(--ink-mute);font-size:13px;font-weight:500;font-family:var(--font-sans);
  padding:9px 16px;transition:all .15s;
}
.btn-secondary:hover{border-color:var(--rule-med);color:var(--ink)}
.btn-danger{
  background:transparent;border:1px solid #fca5a5;border-radius:8px;
  color:#dc2626;font-size:13px;font-weight:500;font-family:var(--font-sans);
  padding:9px 16px;transition:all .15s;
}
.btn-danger:hover{background:#fef2f2;border-color:#dc2626}

/* ── TOKEN MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,14,.4);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.modal{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:32px;width:460px;max-width:92vw}
.modal h3{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ink);margin-bottom:8px;letter-spacing:-.02em}
.modal p{font-size:13px;color:var(--ink-mute);line-height:1.6;margin-bottom:20px}
.modal input{width:100%;background:var(--paper);border:1px solid var(--rule-med);border-radius:8px;color:var(--ink);font-family:var(--font-mono);font-size:13px;padding:10px 14px;outline:none;transition:border-color .15s}
.modal input:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-bg)}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}

/* ── STATES ── */
.state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:12px;color:var(--ink-faint);grid-column:1/-1}
.spinner{width:28px;height:28px;border:2px solid var(--rule-med);border-top-color:var(--purple);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state-icon{font-size:28px;opacity:.4}
.state-text{font-family:var(--font-mono);font-size:12px;letter-spacing:.05em}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--ink);color:#fff;border-radius:10px;
  font-size:13px;font-family:var(--font-mono);padding:10px 18px;
  display:flex;align-items:center;gap:8px;
  transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1}
.toast.success .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex-shrink:0}
.toast.error .dot{width:7px;height:7px;border-radius:50%;background:#f87171;flex-shrink:0}

/* ── UNSAVED BANNER ── */
.unsaved-banner{
  background:var(--purple-bg);border:1px solid var(--purple-bg2);border-radius:8px;
  padding:10px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px;
  font-size:13px;color:var(--purple);
}
.unsaved-banner.hidden{display:none}
.unsaved-banner svg{width:14px;height:14px;flex-shrink:0}
.unsaved-banner .spacer{flex:1}

/* scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule-med);border-radius:3px}
</style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <div class="logo-mark">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="5" height="5" rx="1.2" fill="white"/>
        <rect x="9" y="2" width="5" height="5" rx="1.2" fill="white"/>
        <rect x="2" y="9" width="5" height="5" rx="1.2" fill="white"/>
        <rect x="9" y="9" width="5" height="5" rx="1.2" fill="white"/>
      </svg>
    </div>
    Noetic Creative
  </a>
  <div class="header-gap"></div>
  <div class="search-wrap">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.656a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/></svg>
    <input type="text" id="search" placeholder="Search repos…" autocomplete="off">
  </div>
  <button class="btn-header" id="token-btn">
    <svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M8 0a8.1 8.1 0 0 0-2.56 15.79C5.7 15.87 6 15.64 6 15.3v-1.17c-2.13.47-2.58-1.03-2.58-1.03-.35-.9-.86-1.14-.86-1.14-.7-.48.05-.47.05-.47.77.05 1.18.8 1.18.8.69 1.18 1.8.84 2.24.64.07-.5.27-.84.49-1.03-1.7-.2-3.49-.85-3.49-3.8 0-.84.3-1.53.79-2.07-.08-.2-.34-1 .07-2.07 0 0 .65-.21 2.12.79A7.38 7.38 0 0 1 8 3.92c.65 0 1.31.09 1.93.26 1.47-1 2.12-.79 2.12-.79.42 1.07.16 1.87.08 2.07.49.54.79 1.23.79 2.07 0 2.96-1.8 3.6-3.51 3.79.28.24.52.71.52 1.43v2.12c0 .34.3.58.57.5A8.1 8.1 0 0 0 8 0z"/></svg>
    Token
  </button>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-section">
      <div class="sidebar-label">Views</div>
      <button class="folder-btn active" data-folder="all" onclick="setFolder('all')">
        <span class="icon">⊞</span><span class="label">All repos</span>
        <span class="count" id="cnt-all">—</span>
      </button>
      <button class="folder-btn" data-folder="ungrouped" onclick="setFolder('ungrouped')">
        <span class="icon">·</span><span class="label">Ungrouped</span>
        <span class="count" id="cnt-ungrouped">—</span>
      </button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Folders</div>
      <div id="folder-list"></div>
      <button class="btn-new-folder" onclick="openNewFolder()">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2Z"/></svg>
        New folder
      </button>
    </div>
  </aside>

  <main>
    <div id="unsaved-banner" class="unsaved-banner hidden">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"/></svg>
      Unsaved changes — add a token to sync to GitHub
      <span class="spacer"></span>
      <button class="btn-primary" style="font-size:12px;padding:5px 12px" onclick="saveConfigToGitHub()">Save to GitHub</button>
    </div>
    <div class="toolbar">
      <div class="view-title" id="view-title">All repos <span class="sub" id="view-count"></span></div>
      <div class="sort-group">
        <button class="sort-btn active" data-sort="updated" onclick="setSort('updated')">Recent</button>
        <button class="sort-btn" data-sort="name" onclick="setSort('name')">A–Z</button>
        <button class="sort-btn" data-sort="stars" onclick="setSort('stars')">Stars</button>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="vbtn-grid" onclick="setView('grid')" title="Grid">⊞</button>
        <button class="view-btn" id="vbtn-list" onclick="setView('list')" title="List">☰</button>
      </div>
    </div>
    <div id="repo-container" class="repo-grid"></div>
  </main>
</div>

<!-- Folder Edit Panel -->
<div class="panel-overlay hidden" id="panel-overlay" onclick="e => e.target===this && closePanel()">
  <div class="panel">
    <div class="panel-header">
      <h3 id="panel-title">New Folder</h3>
      <button class="panel-close" onclick="closePanel()">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <div class="field">
        <label>Folder name</label>
        <input type="text" id="f-name" placeholder="e.g. Design, Internal Tools…">
      </div>
      <div class="field">
        <label>Icon</label>
        <div class="icon-picker" id="icon-picker"></div>
      </div>
      <label class="repos-picker-label">Repos in this folder</label>
      <input type="text" class="repos-search" id="repos-search" placeholder="Filter repos…" oninput="filterRepoPicker(this.value)">
      <div class="repos-list" id="repos-list"></div>
      <div class="danger-zone" id="danger-zone" style="display:none">
        <span class="danger-label">Danger zone</span>
        <button class="btn-danger" onclick="deleteCurrentFolder()">Delete this folder</button>
      </div>
    </div>
    <div class="panel-footer">
      <button class="btn-secondary" onclick="closePanel()">Cancel</button>
      <div style="flex:1"></div>
      <button class="btn-primary" onclick="saveFolder()">Save folder</button>
    </div>
  </div>
</div>

<!-- Token Modal -->
<div class="modal-overlay hidden" id="token-modal">
  <div class="modal">
    <h3>GitHub Token</h3>
    <p>Add a classic PAT with <code style="background:var(--paper);padding:1px 5px;border-radius:4px;font-family:var(--font-mono)">repo</code> scope to load private repos and save folder changes back to GitHub.</p>
    <input type="password" id="token-input" placeholder="ghp_…">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="clearToken()">Clear</button>
      <button class="btn-secondary" onclick="closeTokenModal()">Cancel</button>
      <button class="btn-primary" onclick="saveToken()">Save & reload</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script>
// ── State ──────────────────────────────────────────────
let allRepos = [];
let config = { org:'Noetic-Creative', folders:[], ungrouped_label:'Other' };
let configSha = null; // sha for GitHub API updates
let configDirty = false;
let currentFolder = 'all';
let currentSort = 'updated';
let currentView = 'grid';
let searchQ = '';
let editingFolderId = null;
const ICONS = ['▸','◈','⬡','◻','△','◯','✦','⊕','⊞','⬟','⬢','⊛'];

// ── Init ───────────────────────────────────────────────
async function init() {
  renderFolderSidebar();
  showLoading();
  try {
    const cfgResp = await fetch('config.json?_=' + Date.now());
    if (cfgResp.ok) config = await cfgResp.json();
  } catch {}
  renderFolderSidebar();
  await loadRepos();
  await loadConfigSha();
}

async function loadConfigSha() {
  const token = localStorage.getItem('nc_token');
  if (!token) return;
  try {
    const r = await ghFetch('GET', `contents/config.json`);
    configSha = r.sha;
  } catch {}
}

// ── GitHub API ─────────────────────────────────────────
const ORG = () => config.org || 'Noetic-Creative';
const REPO_NAME = 'noetic-creative.github.io';

async function ghFetch(method, path, body) {
  const token = localStorage.getItem('nc_token');
  const resp = await fetch(`https://api.github.com/repos/${ORG()}/${REPO_NAME}/${path}`, {
    method, headers: {
      'Authorization': token ? `Bearer ${token}` : '',
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!resp.ok) throw new Error(await resp.text());
  return resp.json();
}

async function loadRepos() {
  showLoading();
  const token = localStorage.getItem('nc_token');
  const headers = token ? { Authorization: `Bearer ${token}` } : {};
  try {
    let repos = [], page = 1;
    while (true) {
      const r = await fetch(`https://api.github.com/orgs/${ORG()}/repos?per_page=100&page=${page}&sort=updated`, { headers });
      if (!r.ok) throw new Error(`${r.status}`);
      const batch = await r.json();
      repos = repos.concat(batch);
      if (batch.length < 100) break;
      page++;
    }
    allRepos = repos;
    if (token) document.getElementById('token-btn').classList.add('active');
    updateCounts();
    render();
  } catch(e) {
    document.getElementById('repo-container').innerHTML =
      `<div class="state-box"><span class="state-icon">⚠</span><span class="state-text">Could not load repos: ${e.message}</span></div>`;
  }
}

async function saveConfigToGitHub() {
  const token = localStorage.getItem('nc_token');
  if (!token) { openTokenModal(); return; }
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(config, null, 2))));
  const body = { message: 'update config.json', content, branch: 'main' };
  if (configSha) body.sha = configSha;
  try {
    const r = await ghFetch('PUT', 'contents/config.json', body);
    configSha = r.content.sha;
    configDirty = false;
    document.getElementById('unsaved-banner').classList.add('hidden');
    showToast('success', 'Saved to GitHub');
  } catch(e) {
    showToast('error', 'Save failed — check token');
  }
}

// ── Folders ────────────────────────────────────────────
function getFolderRepos(id) {
  const f = config.folders.find(f => f.id === id);
  return f ? allRepos.filter(r => (f.repos||[]).includes(r.name)) : [];
}
function getUngrouped() {
  const all = config.folders.flatMap(f => f.repos||[]);
  return allRepos.filter(r => !all.includes(r.name));
}

function renderFolderSidebar() {
  const list = document.getElementById('folder-list');
  list.innerHTML = '';
  (config.folders||[]).forEach(folder => {
    const item = document.createElement('div');
    item.className = 'folder-item';
    item.innerHTML = `
      <button class="folder-btn" data-folder="${folder.id}" onclick="setFolder('${folder.id}')">
        <span class="icon">${folder.icon||'▸'}</span>
        <span class="label">${esc(folder.name)}</span>
        <span class="count" id="cnt-${folder.id}">—</span>
      </button>
      <button class="edit-btn" onclick="openEditFolder('${folder.id}')" title="Edit folder">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61Zm1.414 1.06a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354l-1.086-1.086ZM11.189 6.25 9.75 4.81l-6.286 6.287a.25.25 0 0 0-.064.108l-.558 1.953 1.953-.558a.249.249 0 0 0 .108-.064l6.286-6.286Z"/></svg>
      </button>`;
    list.appendChild(item);
  });
}

function updateCounts() {
  el('cnt-all').textContent = allRepos.length;
  el('cnt-ungrouped').textContent = getUngrouped().length;
  config.folders.forEach(f => {
    const e = document.getElementById(`cnt-${f.id}`);
    if (e) e.textContent = getFolderRepos(f.id).length;
  });
}

// ── Render ─────────────────────────────────────────────
function getVisible() {
  let repos = currentFolder === 'all' ? [...allRepos]
    : currentFolder === 'ungrouped' ? getUngrouped()
    : getFolderRepos(currentFolder);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    repos = repos.filter(r => r.name.toLowerCase().includes(q) || (r.description||'').toLowerCase().includes(q));
  }
  if (currentSort === 'name') repos.sort((a,b) => a.name.localeCompare(b.name));
  else if (currentSort === 'stars') repos.sort((a,b) => (b.stargazers_count||0)-(a.stargazers_count||0));
  else repos.sort((a,b) => new Date(b.updated_at)-new Date(a.updated_at));
  return repos;
}

function render() {
  const repos = getVisible();
  const c = el('repo-container');
  c.className = 'repo-grid' + (currentView === 'list' ? ' list' : '');

  const names = { all:'All repos', ungrouped: config.ungrouped_label||'Other' };
  const f = config.folders.find(f => f.id === currentFolder);
  el('view-title').innerHTML = `${f ? esc(f.name) : (names[currentFolder]||'All repos')} <span class="sub" id="view-count">${repos.length} repo${repos.length!==1?'s':''}</span>`;

  if (!repos.length) {
    c.innerHTML = `<div class="state-box"><span class="state-icon">◇</span><span class="state-text">${searchQ ? 'No repos match.' : 'No repos here.'}</span></div>`;
    return;
  }
  c.innerHTML = repos.map(r => cardHTML(r)).join('');
}

function cardHTML(r) {
  const lang = r.language||'';
  const lc = `lang-${lang.replace(/[^a-zA-Z]/g,'')||'default'}`;
  const tag = getFolderTag(r.name);
  const icon = (r.language||'??').slice(0,2).toUpperCase();
  const isList = currentView === 'list';
  return `<a class="repo-card" href="${r.html_url}" target="_blank" rel="noopener">
    ${!isList ? `<div class="repo-header">
      <div class="repo-icon">${icon}</div>
      <div>
        <div class="repo-name">${esc(r.name)}${r.private?'<span class="repo-private">private</span>':''}</div>
        ${tag?`<div class="repo-folder-tag">${esc(tag)}</div>`:''}
      </div>
    </div>
    <div class="repo-desc">${r.description?esc(r.description):'<span style="opacity:.5">No description</span>'}</div>`
    : `<div class="repo-icon">${icon}</div>
    <div style="flex:0 0 200px;min-width:0">
      <div class="repo-name">${esc(r.name)}${r.private?'<span class="repo-private">private</span>':''}</div>
      ${tag?`<div class="repo-folder-tag">${esc(tag)}</div>`:''}
    </div>
    <div class="repo-desc">${r.description?esc(r.description):'<span style="opacity:.5">No description</span>'}</div>`}
    <div class="repo-meta">
      ${lang?`<span class="repo-lang"><span class="lang-dot ${lc}"></span>${lang}</span>`:''}
      ${r.stargazers_count?`<span class="repo-stat">★ ${r.stargazers_count}</span>`:''}
      <span class="repo-updated">${relTime(r.updated_at)}</span>
    </div>
  </a>`;
}

function getFolderTag(name) {
  for (const f of config.folders) if ((f.repos||[]).includes(name)) return f.name;
  return null;
}
function showLoading() {
  el('repo-container').innerHTML = `<div class="state-box"><div class="spinner"></div><span class="state-text">Loading…</span></div>`;
}

// ── Controls ───────────────────────────────────────────
function setFolder(id) {
  currentFolder = id;
  document.querySelectorAll('.folder-btn').forEach(b => b.classList.toggle('active', b.dataset.folder===id));
  render();
}
function setSort(s) {
  currentSort = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort===s));
  render();
}
function setView(v) {
  currentView = v;
  el('vbtn-grid').classList.toggle('active', v==='grid');
  el('vbtn-list').classList.toggle('active', v==='list');
  render();
}
el('search').addEventListener('input', e => { searchQ = e.target.value.trim(); render(); });

// ── Folder Panel ───────────────────────────────────────
function buildIconPicker(selected) {
  el('icon-picker').innerHTML = ICONS.map(ic =>
    `<button class="icon-opt${ic===selected?' selected':''}" onclick="selectIcon('${ic}')">${ic}</button>`
  ).join('');
}
function selectIcon(ic) {
  document.querySelectorAll('.icon-opt').forEach(b => b.classList.toggle('selected', b.textContent===ic));
}
function getSelectedIcon() {
  return document.querySelector('.icon-opt.selected')?.textContent || ICONS[0];
}

function buildRepoPicker(selectedNames, filter) {
  const q = (filter||'').toLowerCase();
  const repos = allRepos.filter(r => !q || r.name.toLowerCase().includes(q));
  el('repos-list').innerHTML = repos.map(r => {
    const checked = selectedNames.includes(r.name);
    return `<label class="repo-pick-item${checked?' selected':''}">
      <input type="checkbox" value="${esc(r.name)}" ${checked?'checked':''} onchange="this.closest('.repo-pick-item').classList.toggle('selected',this.checked)">
      <span class="repo-pick-name">${esc(r.name)}</span>
      ${r.language?`<span class="repo-pick-lang">${esc(r.language)}</span>`:''}
    </label>`;
  }).join('');
}

function filterRepoPicker(q) {
  const selected = getSelectedRepos();
  buildRepoPicker(selected, q);
}

function getSelectedRepos() {
  return Array.from(el('repos-list').querySelectorAll('input[type=checkbox]:checked')).map(i => i.value);
}

function openNewFolder() {
  editingFolderId = null;
  el('panel-title').textContent = 'New Folder';
  el('f-name').value = '';
  el('repos-search').value = '';
  el('danger-zone').style.display = 'none';
  buildIconPicker(ICONS[0]);
  buildRepoPicker([]);
  el('panel-overlay').classList.remove('hidden');
  el('panel-overlay').onclick = e => { if (e.target === el('panel-overlay')) closePanel(); };
  setTimeout(() => el('f-name').focus(), 50);
}

function openEditFolder(id) {
  const folder = config.folders.find(f => f.id === id);
  if (!folder) return;
  editingFolderId = id;
  el('panel-title').textContent = 'Edit Folder';
  el('f-name').value = folder.name || '';
  el('repos-search').value = '';
  el('danger-zone').style.display = '';
  buildIconPicker(folder.icon || ICONS[0]);
  buildRepoPicker(folder.repos || []);
  el('panel-overlay').classList.remove('hidden');
  el('panel-overlay').onclick = e => { if (e.target === el('panel-overlay')) closePanel(); };
  setTimeout(() => el('f-name').focus(), 50);
}

function closePanel() { el('panel-overlay').classList.add('hidden'); }

function saveFolder() {
  const name = el('f-name').value.trim();
  if (!name) { el('f-name').focus(); return; }
  const icon = getSelectedIcon();
  const repos = getSelectedRepos();

  if (editingFolderId) {
    const f = config.folders.find(f => f.id === editingFolderId);
    if (f) { f.name = name; f.icon = icon; f.repos = repos; }
  } else {
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + Date.now().toString(36);
    config.folders.push({ id, name, icon, repos });
  }
  closePanel();
  markDirty();
  renderFolderSidebar();
  updateCounts();
  render();
}

function deleteCurrentFolder() {
  if (!editingFolderId) return;
  if (!confirm('Delete this folder? Repos will not be deleted.')) return;
  config.folders = config.folders.filter(f => f.id !== editingFolderId);
  closePanel();
  if (currentFolder === editingFolderId) setFolder('all');
  markDirty();
  renderFolderSidebar();
  updateCounts();
  render();
}

function markDirty() {
  configDirty = true;
  const token = localStorage.getItem('nc_token');
  if (token) {
    el('unsaved-banner').classList.remove('hidden');
  }
}

// ── Token Modal ────────────────────────────────────────
function openTokenModal() {
  el('token-input').value = localStorage.getItem('nc_token') || '';
  el('token-modal').classList.remove('hidden');
}
function closeTokenModal() { el('token-modal').classList.add('hidden'); }
function saveToken() {
  const v = el('token-input').value.trim();
  if (v) localStorage.setItem('nc_token', v);
  closeTokenModal();
  loadRepos();
  loadConfigSha();
}
function clearToken() {
  localStorage.removeItem('nc_token');
  el('token-btn').classList.remove('active');
  closeTokenModal();
  loadRepos();
}
el('token-btn').addEventListener('click', openTokenModal);
el('token-modal').addEventListener('click', e => { if (e.target===el('token-modal')) closeTokenModal(); });

// ── Toast ──────────────────────────────────────────────
let toastTimer;
function showToast(type, msg) {
  const t = el('toast');
  el('toast-msg').textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Helpers ────────────────────────────────────────────
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function relTime(iso) {
  const s = (Date.now()-new Date(iso))/1000;
  if (s<60) return 'just now';
  if (s<3600) return `${Math.floor(s/60)}m ago`;
  if (s<86400) return `${Math.floor(s/3600)}h ago`;
  if (s<86400*30) return `${Math.floor(s/86400)}d ago`;
  if (s<86400*365) return `${Math.floor(s/86400/30)}mo ago`;
  return `${Math.floor(s/86400/365)}y ago`;
}

init();
</script>
</body>
</html>
